services:
  - type: web
    name: safehomerates-leads-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: Reivas
      - key: MONGODB_COLLECTION
        value: safehomerates_leads
      - key: CORS_ORIGINS
        sync: false